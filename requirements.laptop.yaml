# Live home profile. Devices use NTP (Method 1), not NVR clock push.
profile_version: 1
system:
  recording_mode: continuous_24_7
  min_retention_days: null
  analytics_location: camera
  timeline_markers_required: true
  remote_access: lan_vpn_only
  hik_connect: undecided
  time_source: ntp
  https_required: unspecified
devices:
  ptz01:
    camera_protocol: hikvision
    ptz_mode: undecided
    auto_tracking: forbidden
    required_events:
      - line_crossing
    event_targets:
      - human
      - vehicle
    notify_center_required: true
  cam01:
    camera_protocol: unspecified
