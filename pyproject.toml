[project]
name = "haca"
version = "0.1.0.dev0"
description = "Hikvision AI Configuration Auditor (read-only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "defusedxml>=0.7.1",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
ai = ["google-genai"]
web = ["fastapi", "uvicorn", "jinja2"]
browser = ["playwright"]

[project.scripts]
haca = "haca.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haca"]

[tool.hatch.build.targets.wheel.force-include]
"src/haca/isapi/registry/endpoints.yaml" = "haca/isapi/registry/endpoints.yaml"
"src/haca/catalog/settings.yaml" = "haca/catalog/settings.yaml"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/integration/test_simulator.py" = ["S106", "S107"]
"src/haca/simulation/network.py" = ["S105"]
"src/haca/simulation/defaults.py" = ["S105"]
"tests/integration/test_cli_identify.py" = ["S603"]
"src/haca/simulation/digest.py" = ["S324"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["haca.security.*", "haca.isapi.*", "haca.devices.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "security: security-focused tests",
    "simulation: integration tests with mock transport",
    "live: tests against real devices (skipped by default)",
]
addopts = "-m 'not live'"